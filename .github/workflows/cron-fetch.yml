name: Scheduled content fetch

on:
  schedule:
    # Hourly. GitHub-hosted runners can delay scheduled runs by 5-15 min —
    # acceptable for content aggregation; tighten later if needed.
    - cron: "0 * * * *"
  workflow_dispatch: {} # manual trigger from the Actions tab

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      # Mapped from repo secrets (names set via `gh secret set`). The script
      # reads these through lib/supabase/env.ts — same contract as .env.local.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # FID-2026-0905-001: the purge webhook needs the site's origin and the
      # same CRON_SECRET that guards /api/cron/* on Vercel.
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full fetch cycle
        run: npx tsx --tsconfig scripts/tsconfig.json scripts/fetch-all.ts

      # FID-2026-0905-001: the runner writes fresh rows straight to Supabase
      # but cannot import next/cache — this webhook runs purgeContentRoutes()
      # inside the deployed Next server so Vercel's ISR cache drops every
      # content route immediately (no revalidate-window lag). Idempotent and
      # safe to repeat; a partial cycle still wrote data, so run always().
      # Failure is a ::warning::, not a job failure: the DB is already fresh
      # and a missed purge only degrades to revalidate-window freshness.
      - name: Purge production ISR cache
        if: always()
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::SITE_URL and/or CRON_SECRET not set — skipping purge (listing pages self-heal at their revalidate windows)"
            exit 0
          fi
          http=$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/purge") || {
              echo "::warning::purge webhook unreachable (exit $?) — listing pages self-heal at their revalidate windows"
              exit 0
            }
          if [ "$http" = "200" ]; then
            echo "Purge OK (HTTP 200)"
          else
            echo "::warning::purge webhook returned HTTP $http — listing pages self-heal at their revalidate windows"
          fi